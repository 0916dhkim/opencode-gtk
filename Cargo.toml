[package]
name = "opencode-gtk"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A power-efficient GTK client for OpenCode"
license = "MIT"
readme = "README.md"
repository = "https://github.com/0916dhkim/opencode-gtk"

[dependencies]
anyhow = "1.0"
async-channel = "2.3"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
gtk = { package = "gtk4", version = "0.9", features = ["v4_6"] }
keyring = { version = "3.6", features = ["crypto-rust", "sync-secret-service"] }
mime_guess = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

[dev-dependencies]
tempfile = "3.14"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
